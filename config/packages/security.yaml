security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: pharmacy_dashboard   # redirect after login to pharmacy dashboard
            logout:
                path: app_logout
                # where to redirect after logout
                target: home_index
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800   # 1 week

    # Role hierarchy
    role_hierarchy:
        ROLE_ADMIN: ROLE_EMPLOYEE   # admin inherits employee permissions
        # ROLE_SUPER_ADMIN: [ROLE_ADMIN, ...] if needed

    # Note: Only the *first* matching rule is applied
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/pharmacy/login, roles: PUBLIC_ACCESS }
        - { path: ^/pharmacy/register, roles: PUBLIC_ACCESS }
        - { path: ^/pharmacy, roles: ROLE_EMPLOYEE }  # all pharmacy pages require at least employee role
#        - { path: ^/admin, roles: ROLE_ADMIN }        # future admin only routes
#        - { path: ^/pharmacy/stock, roles: ROLE_ADMIN }
#        - { path: ^/pharmacy/fournisseur, roles: ROLE_ADMIN }
#        - { path: ^/pharmacy/customer, roles: ROLE_ADMIN }
#        - { path: ^/pharmacy/category, roles: ROLE_ADMIN }
#        - { path: ^/pharmacy/achat, roles: ROLE_ADMIN }
#        - { path: ^/pharmacy/vente, roles: ROLE_EMPLOYEE }

    #remember_me:
     #   secret: '%kernel.secret%'
      #  lifetime: 604800   # 1 week
       # path: /

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
